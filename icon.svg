<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="glow" cx="66%" cy="34%" r="60%">
      <stop offset="0" stop-color="#FF8C42" stop-opacity=".32"/>
      <stop offset=".6" stop-color="#FF8C42" stop-opacity=".05"/>
      <stop offset="1" stop-color="#FF8C42" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lick" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#FFC76A"/>
      <stop offset=".45" stop-color="#FF8C42" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E8572A" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="char" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="char2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <!-- the burnt-away part of the tile, with a ragged edge -->
    <path id="edge" d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312"/>
    <mask id="unburnt">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312 L440 312 L440 100 L180 100 Z" fill="#000"/>
    </mask>
    <clipPath id="tileShape"><rect x="116" y="150" width="276" height="298" rx="30"/></clipPath>
    <path id="tongue" d="M0 0 C-7 -10 -4 -24 2 -40 C4 -26 12 -20 10 -8 C9 -3 5 1 0 0 Z"/>
  </defs>

  <rect width="512" height="512" rx="112" fill="#15181F"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- striker strip -->
  <rect x="72" y="456" width="368" height="14" rx="4" fill="#4E3424" opacity=".9"/>
  <path d="M80 470 l10 -14 M98 470 l10 -14 M116 470 l10 -14 M134 470 l10 -14 M152 470 l10 -14 M170 470 l10 -14 M188 470 l10 -14 M206 470 l10 -14 M224 470 l10 -14 M242 470 l10 -14 M260 470 l10 -14 M278 470 l10 -14 M296 470 l10 -14 M314 470 l10 -14 M332 470 l10 -14 M350 470 l10 -14 M368 470 l10 -14 M386 470 l10 -14 M404 470 l10 -14 M422 470 l10 -14" stroke="#2C1D14" stroke-width="4" opacity=".9"/>

  <g transform="rotate(-7 256 300)">
    <g mask="url(#unburnt)">
      <!-- tile with its bottom edge -->
      <rect x="116" y="164" width="276" height="284" rx="30" fill="#9C8A66"/>
      <rect x="116" y="150" width="276" height="284" rx="30" fill="#EADFC8"/>
      <!-- the L -->
      <rect x="170" y="206" width="56" height="182" rx="6" fill="#1B1E25"/>
      <rect x="170" y="334" width="140" height="54" rx="6" fill="#1B1E25"/>
      <!-- scorch spreading in from the burning edge -->
      <g clip-path="url(#tileShape)">
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#6B4426" stroke-width="118" stroke-linejoin="round" opacity="0.08"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#623E23" stroke-width="108" stroke-linejoin="round" opacity="0.085"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#5A3920" stroke-width="99" stroke-linejoin="round" opacity="0.102"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#51331D" stroke-width="89" stroke-linejoin="round" opacity="0.133"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#492E1A" stroke-width="79" stroke-linejoin="round" opacity="0.179"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#402917" stroke-width="70" stroke-linejoin="round" opacity="0.242"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#382314" stroke-width="60" stroke-linejoin="round" opacity="0.322"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#2F1E11" stroke-width="51" stroke-linejoin="round" opacity="0.42"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#27190E" stroke-width="41" stroke-linejoin="round" opacity="0.537"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#1E130B" stroke-width="31" stroke-linejoin="round" opacity="0.672"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#160E08" stroke-width="22" stroke-linejoin="round" opacity="0.826"/>
        <path d="M196 150 C214 170 226 158 240 176 C254 194 262 180 276 200 C290 220 300 204 312 226 C324 248 334 236 344 258 C354 280 366 268 376 292 C384 308 398 300 410 312" fill="none" stroke="#0E0906" stroke-width="12" stroke-linejoin="round" opacity="1.0"/>
      </g>
    </g>
    <!-- glowing ember rim along the burn line -->
    <use href="#edge" fill="none" stroke="#FF8C42" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" filter="url(#soft)"/>
    <use href="#edge" fill="none" stroke="#FFE3A8" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- small flames licking off the edge (not one big flame) -->
    <g fill="url(#lick)" filter="url(#soft)">
      <use href="#tongue" transform="translate(236 172) rotate(24) scale(.9)"/>
      <use href="#tongue" transform="translate(272 198) rotate(40) scale(1.55)"/>
      <use href="#tongue" transform="translate(300 214) rotate(28) scale(.8)"/>
      <use href="#tongue" transform="translate(336 248) rotate(44) scale(1.85)"/>
      <use href="#tongue" transform="translate(362 274) rotate(30) scale(.9)"/>
      <use href="#tongue" transform="translate(388 302) rotate(46) scale(1.25)"/>
    </g>
  </g>

  <!-- embers drifting up, and a thin curl of smoke -->
  <circle cx="352" cy="132" r="6" fill="#FFC76A"/>
  <circle cx="398" cy="170" r="4.5" fill="#FF8C42"/>
  <circle cx="312" cy="104" r="3.5" fill="#FF8C42"/>
  <circle cx="430" cy="214" r="3.5" fill="#FFC76A"/>
  <path d="M330 120 C318 96 344 82 330 58 C320 40 338 28 334 14" fill="none" stroke="#AAB2C0" stroke-width="5" stroke-linecap="round" opacity=".18"/>
</svg>
